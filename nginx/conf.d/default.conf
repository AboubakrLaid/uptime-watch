log_format custom_main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

server {
    listen 80;
    server_name upwatch.live www.upwatch.live;
    access_log /var/log/nginx/http_access.log custom_main;
    error_log /var/log/nginx/error.log warn;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name upwatch.live www.upwatch.live;
    access_log /var/log/nginx/https_access.log custom_main;
    error_log /var/log/nginx/error.log warn;

    ssl_certificate /etc/letsencrypt/live/upwatch.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/upwatch.live/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "Nginx is running\n";
    }

    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 30d;
        access_log /var/log/nginx/static_access.log custom_main;
    }

    location / {
        proxy_pass http://uptime-watch-app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        access_log /var/log/nginx/proxy_access.log custom_main;
    }
}
