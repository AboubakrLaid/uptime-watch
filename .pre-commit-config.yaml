repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-merge-conflict
      - id: end-of-file-fixer
        exclude: ^main/migrations/
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: ["--fix=lf"]
        description: Force LF line endings across the repository.

  - repo: local
    hooks:
      - id: isort
        name: isort
        entry: isort
        language: system
        files: ^(main|config|tests)/
        exclude: ^main/migrations/|^__init__\.py$|^main/apps\.py$
        types: [python]
        args: ["--profile", "black", "--filter-files"]

      - id: black
        name: black
        entry: black
        language: system
        files: ^(main|config|tests)/
        exclude: ^main/migrations/|^__init__\.py$|^main/apps\.py$
        types: [python]
        args: ["--line-length=88"]

      - id: flake8
        name: flake8
        entry: flake8
        language: system
        files: ^(main|config|tests)/
        exclude: ^main/migrations/|^__init__\.py$|^main/apps\.py$
        types: [python]
        args: ["--extend-ignore=E203,E501,W503"]

      - id: validate-commit-msg
        name: validate-commit-msg
        language: pygrep
        entry: "^(?:(?:Merge)|(?:feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(?:\\([^)]+\\))?: .+)$"
        args: [--multiline]
        stages: [commit-msg]
