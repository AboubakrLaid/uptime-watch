services:
  uptime-watch-app:
    container_name: uptime-watch-app
    image: ${APP_IMAGE}
    restart: unless-stopped
    environment:
      - ENV
      - DEBUG
      - BACK_HOST
      - DJANGO_PORT
      - DJANGO_SECRET_KEY
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - DB_HOST
      - DB_PORT
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:${DJANGO_PORT}/health/ready/ >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    command: >
      sh -c "gunicorn config.wsgi:application --bind 0.0.0.0:${DJANGO_PORT} --workers 3"

  nginx:
    container_name: uptime-watch-nginx
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      uptime-watch-app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx/logs:/var/log/nginx
      - ./staticfiles:/usr/share/nginx/html/static:ro
