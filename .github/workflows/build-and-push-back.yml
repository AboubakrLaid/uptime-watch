name: Push and Build Back

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: eu-west-3
      ECR_REPOSITORY: uptime-watch
      ECR_REGISTRY: 373080580380.dkr.ecr.eu-west-3.amazonaws.com

    steps:
      - name: Initialize deployment summary
        run: |
          mkdir -p "$RUNNER_TEMP/deployment-summary"
          jq -n \
            --arg attempted_image "" \
            '{
              pipeline_status: "in_progress",
              deployment_outcome: "not_started",
              rollback_attempted: "no",
              rollback_outcome: "not_attempted",
              attempted_image: $attempted_image,
              previous_image_id: "",
              previous_image_reference: "",
              restored_image_reference: "",
              app_restore_outcome: "not_attempted",
              static_restore_outcome: "not_needed",
              failure_stage: "",
              failure_status: ""
            }' > "$RUNNER_TEMP/deployment-summary/summary.json"

      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Authenticate with AWS using GitHub OIDC
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::373080580380:role/uptime-watch-github-actions
          aws-region: eu-west-3

      # 3. Login to Amazon ECR
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login \
                --username AWS \
                --password-stdin "$ECR_REGISTRY"

      # 4. Check whether the ECR repository exists
      - name: Check ECR repository
        run: |
          if ! aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" > /dev/null 2>&1; then

            echo "ECR repository '$ECR_REPOSITORY' does not exist."
            echo "Please create it in AWS infrastructure config before running this workflow."
            exit 1
          fi

      # 5. Build Docker image
      - name: Build image
        id: build
        run: |
          GIT_TAG="${GITHUB_SHA:0:7}"
          IMAGE_TAG="upwatch-back-$(date -u +%Y%m%d-%H%M%S)-${GIT_TAG}"

          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

          echo "Building image: $IMAGE_TAG"

          docker build \
            -t "$ECR_REPOSITORY:$IMAGE_TAG" .

      # 6. Push Docker image to ECR
      - name: Push image
        env:
          IMAGE_TAG: ${{ steps.build.outputs.image_tag }}
        run: |
          docker tag \
            "$ECR_REPOSITORY:$IMAGE_TAG" \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker tag \
            "$ECR_REPOSITORY:$IMAGE_TAG" \
            "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

          echo "Pushing image to ECR..."
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

          echo "Successfully pushed:"
          echo "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      # 7. Discover the deployment EC2 instance by tag
      - name: Find deployment EC2 instance
        id: instance
        run: |
          set -euo pipefail

          INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=upwatch web server" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" \
            --output json)

          mapfile -t INSTANCE_IDS < <(jq -r '.[]' <<< "$INSTANCE_IDS")

          if [[ "${#INSTANCE_IDS[@]}" -ne 1 ]]; then
            echo "Expected exactly one running EC2 instance tagged Name=upwatch web server; found ${#INSTANCE_IDS[@]}."
            exit 1
          fi

          echo "instance_id=${INSTANCE_IDS[0]}" >> "$GITHUB_OUTPUT"
          echo "Found deployment instance: ${INSTANCE_IDS[0]}"

      # 8. Deploy to EC2 through AWS Systems Manager
      - name: Start deployment on EC2 via SSM
        id: deploy
        env:
          AWS_REGION: eu-west-3
          EC2_INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
          IMAGE_TAG: ${{ steps.build.outputs.image_tag }}
        run: |
          set -euo pipefail

          echo "Deploying image: $IMAGE_TAG"

          DEPLOY_LOG="/tmp/uptime-watch-ssm-deploy.log"
          COMMAND="{ sudo -H -u ubuntu -- /bin/bash -c 'set -Eeuo pipefail; echo \"Starting deployment for image \$1\"; cd /home/ubuntu/uptime-watch; exec env IMAGE_TAG=\"\$1\" make deploy IMAGE_TAG=\"\$1\"' _ '$IMAGE_TAG'; } > '$DEPLOY_LOG' 2>&1; DEPLOY_STATUS=\$?; cat '$DEPLOY_LOG'; echo \"__DEPLOY_STATUS=\$DEPLOY_STATUS\"; exit \"\$DEPLOY_STATUS\""

          PARAMETERS=$(jq -n --arg command "$COMMAND" \
            '{commands: [$command], executionTimeout: ["3600"]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy uptime-watch image $IMAGE_TAG" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command ID: $COMMAND_ID"

          jq --arg attempted_image "$IMAGE_TAG" \
            '.deployment_outcome = "in_progress"
             | .rollback_attempted = "unknown"
             | .rollback_outcome = "unknown"
             | .attempted_image = $attempted_image' \
            "$RUNNER_TEMP/deployment-summary/summary.json" \
            > "$RUNNER_TEMP/deployment-summary/summary.json.tmp"
          mv "$RUNNER_TEMP/deployment-summary/summary.json.tmp" \
            "$RUNNER_TEMP/deployment-summary/summary.json"

      # 9. Wait for deployment and report its result
      - name: Wait for deployment
        env:
          EC2_INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
          IMAGE_TAG: ${{ steps.build.outputs.image_tag }}
        run: |
          set -euo pipefail

          SUMMARY_FILE="$RUNNER_TEMP/deployment-summary/summary.json"
          STATUS=""

          # SSM execution is bounded to one hour, with a short reporting grace period.
          for attempt in $(seq 1 366); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Deployment status: ${STATUS:-Pending}"

            case "$STATUS" in
              Success|Failed|TimedOut|Cancelled|DeliveryTimedOut|ExecutionTimedOut|Undeliverable|Terminated|InvalidPlatform|AccessDenied)
                break
                ;;
            esac

            sleep 10
          done

          INVOCATION=""
          STANDARD_OUTPUT=""
          for output_attempt in $(seq 1 12); do
            if INVOCATION=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --plugin-name "aws:runShellScript" \
              --query '{Status:Status,StatusDetails:StatusDetails,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent,OutputUrl:StandardOutputUrl}' \
              --output json 2>/dev/null); then
              STATUS=$(jq -r '.Status // "Unknown"' <<< "$INVOCATION")
              STANDARD_OUTPUT=$(jq -r '.Output // ""' <<< "$INVOCATION")
              STANDARD_ERROR=$(jq -r '.Error // ""' <<< "$INVOCATION")
              if [[ -n "$STANDARD_OUTPUT" || -n "$STANDARD_ERROR" ||
                    "$STATUS" == "Success" || "$STATUS" == "TimedOut" ||
                    "$STATUS" == "Cancelled" || "$STATUS" == "Undeliverable" ||
                    "$STATUS" == "Terminated" || "$STATUS" == "InvalidPlatform" ||
                    "$STATUS" == "AccessDenied" || "$output_attempt" -eq 12 ]]; then
                break
              fi
            else
              INVOCATION=""
            fi
            sleep 5
          done

          if [[ -n "$INVOCATION" ]]; then
            printf 'SSM command result:\n%s\n' "$INVOCATION"
            if [[ -n "${STANDARD_ERROR:-}" ]]; then
              printf 'SSM command stderr:\n%s\n' "$STANDARD_ERROR"
            fi
          else
            echo "Could not retrieve the final SSM command output." >&2
            STANDARD_OUTPUT=""
            STANDARD_ERROR=""
          fi

          marker_value() {
            awk -v prefix="$1=" '
              index($0, prefix) == 1 { value = substr($0, length(prefix) + 1) }
              END { if (value != "") print value }
            ' <<< "$STANDARD_OUTPUT"
          }

          DEPLOYMENT_OUTCOME=$(marker_value DEPLOYMENT_OUTCOME)
          ROLLBACK_ATTEMPTED=$(marker_value ROLLBACK_ATTEMPTED)
          ROLLBACK_OUTCOME=$(marker_value ROLLBACK_OUTCOME)
          ATTEMPTED_IMAGE=$(marker_value ATTEMPTED_IMAGE)
          PREVIOUS_IMAGE_ID=$(marker_value PREVIOUS_IMAGE_ID)
          PREVIOUS_IMAGE_REFERENCE=$(marker_value PREVIOUS_IMAGE_REFERENCE)
          RESTORED_IMAGE_REFERENCE=$(marker_value RESTORED_IMAGE_REFERENCE)
          APP_RESTORE_OUTCOME=$(marker_value APP_RESTORE_OUTCOME)
          STATIC_RESTORE_OUTCOME=$(marker_value STATIC_RESTORE_OUTCOME)
          FAILURE_STAGE=$(marker_value FAILURE_STAGE)
          FAILURE_STATUS=$(marker_value FAILURE_STATUS)

          case "$DEPLOYMENT_OUTCOME" in
            deployment_succeeded|deployment_failed) ;;
            *) DEPLOYMENT_OUTCOME="unknown" ;;
          esac
          case "$ROLLBACK_ATTEMPTED" in
            yes|no) ;;
            *) ROLLBACK_ATTEMPTED="unknown" ;;
          esac
          case "$ROLLBACK_OUTCOME" in
            not_attempted|unavailable|succeeded|failed) ;;
            *) ROLLBACK_OUTCOME="unknown" ;;
          esac
          ATTEMPTED_IMAGE="${ATTEMPTED_IMAGE:-$IMAGE_TAG}"

          jq \
            --arg pipeline_status "$STATUS" \
            --arg deployment_outcome "$DEPLOYMENT_OUTCOME" \
            --arg rollback_attempted "$ROLLBACK_ATTEMPTED" \
            --arg rollback_outcome "$ROLLBACK_OUTCOME" \
            --arg attempted_image "$ATTEMPTED_IMAGE" \
            --arg previous_image_id "$PREVIOUS_IMAGE_ID" \
            --arg previous_image_reference "$PREVIOUS_IMAGE_REFERENCE" \
            --arg restored_image_reference "$RESTORED_IMAGE_REFERENCE" \
            --arg app_restore_outcome "${APP_RESTORE_OUTCOME:-unknown}" \
            --arg static_restore_outcome "${STATIC_RESTORE_OUTCOME:-unknown}" \
            --arg failure_stage "$FAILURE_STAGE" \
            --arg failure_status "$FAILURE_STATUS" \
            '.pipeline_status = $pipeline_status
             | .deployment_outcome = $deployment_outcome
             | .rollback_attempted = $rollback_attempted
             | .rollback_outcome = $rollback_outcome
             | .attempted_image = $attempted_image
             | .previous_image_id = $previous_image_id
             | .previous_image_reference = $previous_image_reference
             | .restored_image_reference = $restored_image_reference
             | .app_restore_outcome = $app_restore_outcome
             | .static_restore_outcome = $static_restore_outcome
             | .failure_stage = $failure_stage
             | .failure_status = $failure_status' \
            "$SUMMARY_FILE" > "$SUMMARY_FILE.tmp"
          mv "$SUMMARY_FILE.tmp" "$SUMMARY_FILE"

          if [[ "$STATUS" != "Success" ]]; then
            echo "Deployment failed or timed out. Final status: $STATUS"
            exit 1
          fi

          if [[ "$DEPLOYMENT_OUTCOME" != "deployment_succeeded" ]]; then
            echo "SSM reported success without a deployment success marker."
            exit 1
          fi

          echo "Deployment completed successfully."

      - name: Upload deployment summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-summary
          path: ${{ runner.temp }}/deployment-summary/summary.json
          if-no-files-found: warn
          retention-days: 7
