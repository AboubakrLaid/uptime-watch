name: Push and Build Back

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: eu-west-3
      ECR_REPOSITORY: uptime-watch
      ECR_REGISTRY: 373080580380.dkr.ecr.eu-west-3.amazonaws.com

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Display GitHub context
      - name: Debug GitHub identity
        run: |
          echo "repository=${{ github.repository }}"
          echo "ref=${{ github.ref }}"
          echo "event_name=${{ github.event_name }}"

      # 3. Inspect actual OIDC token claims
      - name: Inspect OIDC claims
        shell: bash
        run: |
          TOKEN_JSON=$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          ID_TOKEN=$(echo "$TOKEN_JSON" | jq -r '.value')

          node -e '
            const token = process.argv[1];

            const payload = JSON.parse(
              Buffer.from(token.split(".")[1], "base64url").toString("utf8")
            );

            const claims = [
              "iss",
              "aud",
              "sub",
              "repository",
              "repository_id",
              "repository_owner",
              "repository_owner_id",
              "ref",
              "event_name"
            ];

            for (const claim of claims) {
              console.log(`${claim}=${JSON.stringify(payload[claim])}`);
            }
          ' "$ID_TOKEN"

      # 4. Authenticate with AWS using GitHub OIDC
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::373080580380:role/uptime-watch-github-actions
          aws-region: eu-west-3

      # 5. Login to Amazon ECR
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login \
                --username AWS \
                --password-stdin "$ECR_REGISTRY"

      # 6. Ensure ECR repository exists
      - name: Ensure repository exists
        run: |
          if ! aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" > /dev/null 2>&1; then

            aws ecr create-repository \
              --repository-name "$ECR_REPOSITORY" \
              --region "$AWS_REGION" \
              --image-scanning-configuration scanOnPush=true \
              --encryption-configuration encryptionType=AES256
          fi

      # 7. Build and push Docker image
      - name: Build and push image
        run: |
          IMAGE_TAG="${GITHUB_REF_NAME}-${GITHUB_SHA:0:7}"
          RUN_TAG="${GITHUB_REF_NAME}-${GITHUB_RUN_NUMBER}"

          echo "Building image: $IMAGE_TAG"

          docker build \
            -t "$ECR_REPOSITORY:$IMAGE_TAG" .

          docker tag \
            "$ECR_REPOSITORY:$IMAGE_TAG" \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker tag \
            "$ECR_REPOSITORY:$IMAGE_TAG" \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$RUN_TAG"

          echo "Pushing images to ECR..."

          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$RUN_TAG"

          echo "Successfully pushed:"
          echo "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "$ECR_REGISTRY/$ECR_REPOSITORY:$RUN_TAG"
