services:
  uptime-watch-db:
    container_name: uptime-watch-db
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - ENV
      - DEBUG
      - BACK_HOST
      - DJANGO_PORT
      - DJANGO_SECRET_KEY
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - DB_HOST
      - DB_PORT
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - uptime_watch_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  uptime-watch-app:
    container_name: uptime-watch-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - ENV
      - DEBUG
      - BACK_HOST
      - DJANGO_PORT
      - DJANGO_SECRET_KEY
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - DB_HOST=uptime-watch-db
      - DB_PORT
    depends_on:
      uptime-watch-db:
        condition: service_healthy
    ports:
      - "${DJANGO_PORT}:8000"
    volumes:
      - .:/code
    command: >
      sh -c "python manage.py runserver 0.0.0.0:${DJANGO_PORT}"

volumes:
  uptime_watch_pgdata:
